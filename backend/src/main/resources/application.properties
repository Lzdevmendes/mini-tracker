spring.application.name=mini-tracker
server.port=8080

# SQLite Persistence Configuration
spring.datasource.url=jdbc:sqlite:minitracker.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SQLite handles single writer best with 1 connection pool size
spring.datasource.hikari.maximum-pool-size=1

# JWT Security Configuration (256-bit base64 secret key & 24h expiration)
app.security.jwt.secret=Zm9vZHktZGVsaXZlcnktbWluaS10cmFja2VyLXNlY3JldC1rZXktMjAyNi1zZWN1cmUtdG9rZW4=
app.security.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
